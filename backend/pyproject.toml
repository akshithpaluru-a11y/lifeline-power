[project]
name = "lifeline-power-backend"
version = "1.0.0"
description = "LifeLine Power API: battery runtime planner, outage alarm and live caregiver alerts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "sse-starlette==3.5.0",
    "cachetools==7.2.1",
    "anthropic==1.13.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "types-cachetools==7.0.0.20260713",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
    "ASYNC",# flake8-async
    "PTH",  # use pathlib
    "D",    # pydocstyle
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
    "D203", # conflicts with D211
    "D213", # conflicts with D212
    "D401", # docstrings may describe the result ("The plan for...") rather than command
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
